<div class="page-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div
          class="d-sm-flex justify-content-between align-items-center page-title-box mt-4"
        >
          <div>
            <h4 class="fw-bold mb-sm-0 font-size-18">Paiements de factures</h4>
          </div>
          <div class="page-title-right">
            <ol class="breadcrumb m-0">
              <li class="breadcrumb-item">
                <a><span>Transactions</span></a>
              </li>
              <li class="breadcrumb-item active">
                <span>Paiements de factures</span>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-8 col-xl-9">
        <div class="card">
          <div class="card-body">
            <div class="row">
              <!-- ================= SKELETON ================= -->
              <ng-container *ngIf="loadingFacturier; else realFacturiers">
                <div
                  class="col-sm-6 col-xl-3"
                  *ngFor="let item of [1, 2, 3, 4, 5, 6, 7, 8]"
                >
                  <div
                    class="card card-custom text-center skeleton-card"
                    style="height: 14rem"
                  >
                    <div class="skeleton skeleton-image mb-2"></div>
                    <div class="card-body">
                      <div class="skeleton skeleton-text w-75 mx-auto"></div>
                    </div>
                  </div>
                </div>
              </ng-container>

              <!-- ================= CONTENU RÉEL ================= -->
              <ng-template #realFacturiers>
                <div
                  class="col-sm-6 col-xl-3"
                  *ngFor="let facturier of listeFacturier"
                >
                  <button
                    type="button"
                    class="p-0 border-0 bg-transparent w-100 text-start"
                    (click)="nextPages(facturier.FacturierName)"
                  >
                    <div
                      class="card card-custom text-center"
                      style="height: 14rem"
                    >
                    <!-- [src]="
                          'https://dev-api-bcibankjs.ecash-guinee.com/api/webdav/read-image/' +
                          facturier.vcLogoPath
                        " -->
                      <img
                        style="height: 10rem"
                        src="assets/img/logos/LOGO%20BCI%20-%20Internet%20Banking%20-%202-W-2.svg?h=c746ea9e25952b9505731b7d644e74e9"
                        [alt]="facturier.FacturierName"
                      />
                      <div class="card-body">
                        <h5 class="fw-semibold font-size-16 mb-1">
                          <span class="text-body">{{
                            facturier.FacturierName
                          }}</span>
                        </h5>
                      </div>
                    </div>
                  </button>
                </div>
              </ng-template>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4 col-xl-3">
        <div class="card bg-light mb-4">
          <div class="card-body">
            <a href="#" class="custom-icon-container">
              <img class="my-3" src="assets/img/images-bci/Icon-Info-BCI.svg" />
            </a>
            <h4 class="fw-bold text-center">
              Payez vos factures facilement&nbsp;!
            </h4>
            <p class="text-start mt-3">
              Grâce à notre service, réglez vos factures rapidement et sans
              complications, en toute simplicité.
            </p>
            <p class="fw-semibold text-start mt-3">
              Un service conçu pour vous offrir rapidité, confort et sécurité.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
