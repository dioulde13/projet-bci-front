<!-- chequier-form.component.html -->
<div class="page-wrapper">
    <div class="card">
        <h2 class="card-title">Demande de nouveau chéquier</h2>

        <div class="form-group">
            <label class="form-label required">Du compte</label>
            <div class="select-wrapper">
                <select class="form-control" [(ngModel)]="selectedCompte" name="compte">
                    <option value="" disabled selected>Sélectionner le compte source</option>
                    <option value="1">Compte courant - 001234567</option>
                    <option value="2">Compte épargne - 009876543</option>
                </select>
                <span class="select-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </span>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label required">Sélectionner la succursale d'expédition</label>
            <div class="select-wrapper">
                <select class="form-control" [(ngModel)]="selectedSuccursale" name="succursale">
                    <option value="" disabled selected>Sélectionner la succursale d'expédition</option>
                    <option value="1">Succursale Centrale</option>
                    <option value="2">Succursale Nord</option>
                    <option value="3">Succursale Sud</option>
                </select>
                <span class="select-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </span>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label required">Sélectionnez le nombre de feuilles</label>
            <div class="select-wrapper">
                <select class="form-control" [(ngModel)]="selectedFeuilles" name="feuilles">
                    <option value="" disabled selected>Sélectionnez le nombre de feuilles</option>
                    <option value="10">10 feuilles</option>
                    <option value="25">25 feuilles</option>
                    <option value="50">50 feuilles</option>
                    <option value="100">100 feuilles</option>
                </select>
                <span class="select-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </span>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-cancel" type="button" (click)="onAnnuler()">Annuler</button>
            <button class="btn btn-primary" type="button" (click)="onProceder()">Procéder</button>
        </div>
    </div>
</div>
